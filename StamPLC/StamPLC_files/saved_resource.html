<!DOCTYPE html>
<!-- saved from url=(0025)https://chat.m5stack.com/ -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>M5Stack AI FAE</title>

  <!-- 自定义CSS -->
  <link rel="stylesheet" href="./style.css">

  <script src="./marked.min.js.download"></script>
  <link rel="stylesheet" href="./default.min.css">
  <script src="./highlight.min.js.download"></script>

  <link rel="icon" type="image/x-icon" href="https://chat.m5stack.com/static/favicon.ico">

  <!-- 多语言支持 -->
  <script src="./languages.js.download"></script>

  <!-- 初始化检查 -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const modal = document.querySelector('.feedback-modal');
      const overlay = document.querySelector('.modal-overlay');
      console.log('Feedback modal:', modal);
      console.log('Modal overlay:', overlay);
    });
  </script>

</head>

<body class="show-chatbot">
  <!-- 聊天弹窗 -->
  <div class="chatbot-popup">
    <div class="chat-header">
      <h2 class="logo-text" id="logo-text">M5Stack Support</h2>
    </div>
    <div class="chat-body">
      <div class="message bot-message">
        <div class="message-text" id="welcome-message">Hi, this is M5Stack Support. How can I help you today?</div>
      </div>
    </div>
    <div class="chat-footer">
      <form class="chat-form">
        <textarea class="message-input" id="message-input" placeholder="Press Enter to Send (Shift+Enter for New Line)" required="" style="resize: vertical; min-height: 48px; max-height: 320px;"></textarea>
        <button type="submit">
          <!-- Send SVG -->
          <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
            <path d="M2 21l21-9-21-9v9l15 0-15 0v9z"></path>
          </svg>
        </button>
      </form>
      <button id="export-md-btn" class="export-md-btn" style="margin-top:8px;margin-bottom:4px;float:right;">Export as Markdown</button>
      <div class="ai-disclaimer" id="ai-disclaimer" style="text-align:center;color:#888;font-size:13px;margin-top:6px;">All answers are generated by AI and do not represent the platform.</div>
    </div>
  </div>

  <!-- 反馈弹窗 -->
  <div class="modal-overlay">
    <div class="feedback-modal">
      <h3 id="feedback-title"></h3>
      <div class="feedback-options">
        <label class="feedback-option">
          <input type="radio" name="feedback" value="factual_error">
          <span id="option-factual-error"></span>
        </label>
        <label class="feedback-option">
          <input type="radio" name="feedback" value="irrelevant">
          <span id="option-irrelevant"></span>
        </label>
        <label class="feedback-option">
          <input type="radio" name="feedback" value="other">
          <span id="option-other"></span>
        </label>
      </div>
      <textarea class="feedback-input" id="feedback-detail" rows="3"></textarea>
      <div class="feedback-buttons">
        <button type="button" id="cancel-feedback"></button>
        <button type="button" id="submit-feedback"></button>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script src="./script.js.download"></script>
  <script>
    // 多语言免责声明
    (function () {
      // 优先用 currentTranslation.disclaimer，否则用英文兜底
      var disclaimer = (window.currentTranslation && window.currentTranslation.disclaimer)
        || "All answers are generated by AI model and do not represent the platform's position.";
      document.getElementById('ai-disclaimer').textContent = disclaimer;
    })();
  </script>

  <!-- 自动刷新：周期性检查 /static/version.json ，若发生变化则提示并刷新页面 -->
  <script>
    (function () {
      const VERSION_URL = '/static/version.json';
      let currentVersion = null;
      let checking = false;
      let refreshScheduled = false;

      function showUpdateBanner(text) {
        let banner = document.getElementById('static-update-banner');
        if (!banner) {
          banner = document.createElement('div');
          banner.id = 'static-update-banner';
          banner.style = 'position:fixed;left:8px;right:8px;bottom:16px;background:#fff8;backdrop-filter:blur(6px);padding:8px 12px;border-radius:6px;text-align:center;z-index:9999;color:#000;border:1px solid rgba(0,0,0,0.06)';
          document.body.appendChild(banner);
        }
        banner.textContent = text;
      }

      async function fetchVersion() {
        if (checking) return;
        checking = true;
        try {
          const r = await fetch(VERSION_URL, { cache: 'no-store' });
          if (!r.ok) return;
          const j = await r.json();
          const v = j && j.version;
          if (!v) return;

          if (!currentVersion) {
            currentVersion = v; // first seen version
            return;
          }

          if (v !== currentVersion) {
            if (refreshScheduled) return;
            refreshScheduled = true;
            console.log('Static version changed', currentVersion, '->', v);
            if (window.chatStreamActive) {
              window.chatRefreshPending = true;
              showUpdateBanner('页面已更新，当前回复结束后自动刷新...');
              return;
            }
            showUpdateBanner('页面已更新，正在刷新...');
            setTimeout(() => location.reload(), 800);
          }
        } catch (e) {
          // ignore network errors silently
        } finally {
          checking = false;
        }
      }

      document.addEventListener('DOMContentLoaded', function () {
        fetchVersion();
        // 检查间隔：3秒
        setInterval(fetchVersion, 3000);
      });
    })();
  </script>




</body></html>
